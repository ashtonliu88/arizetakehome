[project]
name = "router-lab"
version = "0.1.0"
description = "Confidence-gated decision routing: recoverable errors, cost, latency, and Phoenix evidence"
readme = "README.md"
authors = [
    { name = "Ashton Liu", email = "130876023+ashtonliu88@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix>=20.19.0",
    "arize-phoenix-client>=3.5.0",
    "arize-phoenix-evals>=3",
    "arize-phoenix-otel>=0.16.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.26.0",
    "openinference-instrumentation-openai>=0.1.64",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
]

[project.scripts]
router-lab = "router_lab.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: local Phoenix subprocess; no paid API calls"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
